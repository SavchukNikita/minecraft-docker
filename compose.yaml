services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${SERVER_TYPE:-FORGE}"
      VERSION: "${MINECRAFT_VERSION:-1.20.1}"
      FORGE_VERSION: "${FORGE_VERSION:-}"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-}"
      FABRIC_LOADER_VERSION: "${FABRIC_LOADER_VERSION:-}"
      FABRIC_LAUNCHER_VERSION: "${FABRIC_LAUNCHER_VERSION:-}"
      QUILT_LOADER_VERSION: "${QUILT_LOADER_VERSION:-}"
      QUILT_INSTALLER_VERSION: "${QUILT_INSTALLER_VERSION:-}"
      MEMORY: "${MEMORY:-12G}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      MOTD: "${MOTD:-Minecraft server}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      REMOVE_OLD_MODS: "TRUE"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
